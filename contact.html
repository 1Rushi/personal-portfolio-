<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Contact Pro</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

/* BODY */
body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 20% 20%, #7b2ff7, #000);
    overflow-x:hidden;
    overflow-y:auto;
}

/* ORBS */
.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.4;
    animation: float 8s infinite ease-in-out;
}

.orb1{
    width:250px;height:250px;
    background:#7b2ff7;
    top:10%; left:10%;
}

.orb2{
    width:200px;height:200px;
    background:#ff4ecd;
    bottom:10%; right:10%;
    animation-delay:2s;
}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-40px)}
}

/* WRAPPER */
.wrapper{
    perspective:1200px;
    width:100%;
    display:flex;
    justify-content:center;
    padding:20px;
}

/* CARD */
.card{
    width:700px;
    max-width:95%;
    min-height:420px;
    padding:40px;
    border-radius:24px;

    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);

    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 30px 80px rgba(0,0,0,0.6);

    color:#fff;
    text-align:center;

    transform-style:preserve-3d;
    transition: transform 0.15s ease;
    position:relative;
}

/* LIGHT SPOT */
.card::before{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(circle at var(--x) var(--y),
        rgba(255,255,255,0.25), transparent 40%);
    border-radius:24px;
    pointer-events:none;
}

/* TEXT */
.card h2{
    transform: translateZ(60px);
    font-size:32px;
}

.card p{
    transform: translateZ(40px);
    margin-bottom:25px;
}

/* INFO */
.info{
    display:flex;
    flex-direction:column;
    gap:15px;
}

/* ITEMS */
.info a,
.info div{
    text-decoration:none;
    padding:14px;
    border-radius:12px;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    background:linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
    transform:translateZ(30px);
    transition:0.3s;
}

.info a:hover{
    transform:translateZ(60px) scale(1.05);
    background:linear-gradient(135deg,#7b2ff7,#ff4ecd);
}

/* GLOW */
.card:hover{
    box-shadow:0 0 40px rgba(255,78,205,0.4),
               0 30px 80px rgba(0,0,0,0.6);
}

/* ================= MOBILE FIX ================= */
@media(max-width:768px){

    body{
        align-items:center;
        justify-content:center;
        padding:20px;
        min-height:100vh;
    }

    .card{
        width:95%;
        padding:25px;
        min-height:auto;

        /* keep 3D but reduce effect */
        transform-style:preserve-3d;
        transition: transform 0.2s ease;
    }

    .card h2{
        font-size:24px;
    }

    .card p{
        font-size:14px;
    }

    .orb{
        filter:blur(80px);
        opacity:0.25;
    }
}

</style>
</head>

<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="wrapper">
    <div class="card" id="card">

        <h2>Contact Me</h2>
        <p>Let’s build something powerful 🚀</p>

        <div class="info">

            <a href="mailto:rushikeshkakade603@gmail.com">
                <i class="fa fa-envelope"></i> Email Me
            </a>

            <a href="tel:+917039967948">
                <i class="fa fa-phone"></i> Call Me
            </a>

            <div>
                <i class="fa fa-location-dot"></i> India
            </div>

        </div>

    </div>
</div>

<script>

const card = document.getElementById("card");

let currentX = 0, currentY = 0;
let targetX = 0, targetY = 0;

/* DESKTOP MOUSE */
document.addEventListener("mousemove", (e) => {

    targetX = (window.innerWidth / 2 - e.clientX) / 25;
    targetY = (window.innerHeight / 2 - e.clientY) / 25;

    card.style.setProperty('--x', e.clientX + "px");
    card.style.setProperty('--y', e.clientY + "px");
});

/* MOBILE TOUCH SUPPORT */
document.addEventListener("touchmove", (e) => {
    let touch = e.touches[0];

    targetX = (window.innerWidth / 2 - touch.clientX) / 25;
    targetY = (window.innerHeight / 2 - touch.clientY) / 25;

    card.style.setProperty('--x', touch.clientX + "px");
    card.style.setProperty('--y', touch.clientY + "px");
});

/* ANIMATION LOOP */
let speed = window.innerWidth < 768 ? 0.05 : 0.1;

function animate(){
    currentX += (targetX - currentX) * speed;
    currentY += (targetY - currentY) * speed;

    card.style.transform = `rotateY(${currentX}deg) rotateX(${currentY}deg)`;

    requestAnimationFrame(animate);
}

animate();

/* RESET */
document.addEventListener("mouseleave", () => {
    targetX = 0;
    targetY = 0;
});

</script>

</body>
</html>
